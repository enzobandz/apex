name: OpenPDF Studio release

# Push a tag like `openpdf-v0.1.0` to build installers for Windows, macOS and
# Linux and attach them, with SHA-256 checksums, to a draft GitHub release.
# Builds are unsigned unless signing secrets are configured:
#   Windows: WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
#   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (notarisation)

on:
  push:
    tags: ["openpdf-v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: openpdf-studio

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openpdf-studio/app/package-lock.json
      - name: Import Windows signing certificate
        id: cert
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        env:
          CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          PASS: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERT))
          $c = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:PASS -AsPlainText -Force)
          Remove-Item $path
          "thumbprint=$($c.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Configure Windows signing
        if: steps.cert.outputs.thumbprint != ''
        shell: pwsh
        working-directory: openpdf-studio/app/src-tauri
        run: |
          $conf = Get-Content tauri.conf.json -Raw | ConvertFrom-Json
          $conf.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue "${{ steps.cert.outputs.thumbprint }}" -Force
          $conf.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue "sha256" -Force
          $conf.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue "http://timestamp.digicert.com" -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content tauri.conf.json
      - name: Build installers
        working-directory: openpdf-studio/app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm ci
          npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            openpdf-studio/target/**/release/bundle/nsis/*.exe
            openpdf-studio/target/**/release/bundle/msi/*.msi
            openpdf-studio/target/**/release/bundle/dmg/*.dmg
            openpdf-studio/target/**/release/bundle/deb/*.deb
            openpdf-studio/target/**/release/bundle/rpm/*.rpm
            openpdf-studio/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and draft release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find . -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec mv {} . \;
          sha256sum *.exe *.msi *.dmg *.deb *.rpm *.AppImage > SHA256SUMS.txt 2>/dev/null || true
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft \
            --title "OpenPDF Studio ${GITHUB_REF_NAME#openpdf-v}" \
            --notes "Unsigned builds unless signing secrets are configured. Verify downloads with SHA256SUMS.txt." \
            ./*.exe ./*.msi ./*.dmg ./*.deb ./*.rpm ./*.AppImage SHA256SUMS.txt

name: OpenPDF Studio

on:
  push:
    branches: [main]
    paths: ["openpdf-studio/**", ".github/workflows/openpdf-studio*.yml"]
  pull_request:
    paths: ["openpdf-studio/**", ".github/workflows/openpdf-studio*.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openpdf-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: openpdf-studio

jobs:
  checks:
    name: Engine, app shell and UI checks (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev qpdf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: openpdf-studio
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openpdf-studio/app/package-lock.json
      - name: UI — install, typecheck, unit tests, build
        working-directory: openpdf-studio/app
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Third-party license allow-list
        run: node scripts/third-party.mjs > /dev/null
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Engine, CLI and shell tests (with qpdf structural validation)
        run: cargo test --locked --workspace

  e2e:
    name: End-to-end tests of the real app (Linux, WebKitGTK)
    runs-on: ubuntu-22.04
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev webkit2gtk-driver xvfb dbus-x11
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: openpdf-studio
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openpdf-studio/app/package-lock.json
      - run: cargo install tauri-driver --locked
      - name: Build debug app and CLI
        working-directory: openpdf-studio/app
        run: |
          npm ci
          npx tauri build --debug --no-bundle
          cargo build --locked -p opdf-cli
      - name: Run E2E suite
        working-directory: openpdf-studio/app
        run: xvfb-run -a dbus-run-session -- node e2e/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: openpdf-studio/app/e2e/screenshots
          if-no-files-found: ignore

  bundle:
    name: Build & test on ${{ matrix.os }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: openpdf-studio
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openpdf-studio/app/package-lock.json
      - name: Engine and CLI tests on this OS
        run: cargo test --locked -p opdf-core -p opdf-cli
      - name: Build installers
        working-directory: openpdf-studio/app
        run: |
          npm ci
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: openpdf-studio-${{ runner.os }}
          path: |
            openpdf-studio/target/release/bundle/nsis/*.exe
            openpdf-studio/target/release/bundle/msi/*.msi
            openpdf-studio/target/release/bundle/dmg/*.dmg
            openpdf-studio/target/release/bundle/deb/*.deb
            openpdf-studio/target/release/bundle/rpm/*.rpm
            openpdf-studio/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: openpdf-studio/app
        run: |
          npm ci
          npm audit --audit-level=high --omit=dev
